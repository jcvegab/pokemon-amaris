name: Docker

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: docker/build-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: backend
            dockerfile: apps/backend/Dockerfile
            target: runtime
          - name: frontend
            dockerfile: apps/frontend/Dockerfile
            target: runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image tags
        id: tags
        shell: bash
        run: |
          ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          safe_ref="$(printf '%s' "$ref" | tr '/:@' '---' | tr -cd '[:alnum:]_.-')"
          sha_tag="${GITHUB_SHA::12}"
          {
            echo "tags<<EOF"
            echo "pokemon-amaris-${{ matrix.app.name }}:${sha_tag}"
            echo "pokemon-amaris-${{ matrix.app.name }}:${safe_ref}"
            echo "pokemon-amaris-${{ matrix.app.name }}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          target: ${{ matrix.app.target }}
          push: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,scope=${{ matrix.app.name }},mode=max
