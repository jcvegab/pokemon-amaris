services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: pokemon
      POSTGRES_DB: pokemon
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pokemon -d pokemon']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  db-init:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://pokemon:pokemon@db:5432/pokemon
    command: pnpm --filter @pokemon-amaris/backend prisma:push
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://pokemon:pokemon@db:5432/pokemon
      POKEAPI_BASE_URL: https://pokeapi.co/api/v2
      POKEAPI_TIMEOUT_MS: 5000
      LOG_LEVEL: info
    ports:
      - '3000:3000'
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runtime
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres-data:
